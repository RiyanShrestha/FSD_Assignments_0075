<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rs-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="rs-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Hexagon Outline -->
  <polygon points="256,40 440,146 440,366 256,472 72,366 72,146" 
           fill="none" 
           stroke="url(#rs-gradient)" 
           stroke-width="16" 
           stroke-linejoin="round"
           filter="url(#rs-shadow)"/>
           
  <!-- Monogram RS -->
  <g transform="translate(116, 116)" filter="url(#rs-shadow)">
    <!-- The 'R' Stem and Loop -->
    <path d="M40,40 L40,240 M40,40 L140,40 C190,40 190,120 140,120 L40,120 M110,120 L180,240" 
          fill="none" 
          stroke="url(#rs-gradient)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- The 'S' curve intertwined -->
    <path d="M220,90 C220,50 160,55 160,95 C160,140 240,130 240,185 C240,225 180,230 180,190" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>