<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Node.js Lab</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f9f9f9; color: #333; }
    nav { margin-bottom: 30px; }
    nav a { margin-right: 12px; text-decoration: none; color: #0066cc; }
    nav a:hover { text-decoration: underline; }
    h1 { color: #2c3e50; }
    form { margin-top: 20px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 20px; padding: 10px 24px; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #005bb5; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/register">Register</a>
    <a href="/users">All Users</a>
    <a href="/users/odd">Odd Users</a>
    <a href="/users/even">Even Users</a>
  </nav>

  <h1>Registration</h1>

  <form action="/api/register" method="POST">
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" name="firstName" required />

    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" name="lastName" required />

    <button type="submit">Submit</button>
  </form>
</body>
</html>
